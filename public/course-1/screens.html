<script>
const themeToggle=document.querySelector('#themeToggle'),sunIcon='<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/></svg>',moonIcon='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.4 15.3A8.6 8.6 0 0 1 8.7 3.6 8.7 8.7 0 1 0 20.4 15.3z"/></svg>';
function applyTheme(theme,save=false){const light=theme==='light';document.documentElement.dataset.theme=light?'light':'dark';themeToggle.innerHTML=light?moonIcon:sunIcon;themeToggle.setAttribute('aria-label',`Switch to ${light?'dark':'light'} mode`);themeToggle.title=`Switch to ${light?'dark':'light'} mode`;document.querySelector('meta[name="theme-color"]').content=light?'#f6f8fc':'#080b12';if(save){try{localStorage.setItem('osobola-theme',light?'light':'dark')}catch{}window.dispatchEvent(new CustomEvent('osobola-theme-change',{detail:light}))}}
try{applyTheme(localStorage.getItem('osobola-theme')==='light'?'light':'dark')}catch{applyTheme('dark')}
themeToggle.addEventListener('click',()=>applyTheme(document.documentElement.dataset.theme==='light'?'dark':'light',true));
window.addEventListener('storage',event=>{if(event.key==='osobola-theme')applyTheme(event.newValue==='light'?'light':'dark')});
window.addEventListener('osobola-theme-change',event=>applyTheme(event.detail?'light':'dark'));
const scenes=[
{title:"Welcome to Osobola Online Coding Course",say:"🎙️ Welcome to Osobola Online Coding Course\n\nHello everyone, and welcome to this exciting journey of learning how to build and manage your own websites with the help of Artificial Intelligence!",art:`<g class="phase"><path class="stroke trace" d="M230 245h300v190H230z"/><path class="accent" d="M230 282h300M258 310h125M258 335h180M258 360h88"/><path class="stroke" d="m382 406 35-25 32 18 39-45"/><text class="label" x="380" y="454" text-anchor="middle">Your ideas</text><text class="small" x="380" y="478" text-anchor="middle">A website you can shape</text></g><g class="phase"><path class="warm trace" d="M660 395c42-60 87-60 128 0M700 395c30-37 56-37 84 0"/><circle class="soft" cx="744" cy="354" r="17"/><path class="accent" d="M744 330v-18m-25 27-14-10m78 10 14-10"/><text class="badge" x="744" y="445" text-anchor="middle">AI as your learning partner</text></g>`},
{title:"Relax. This course is for you.",say:"First of all, I want you to relax and feel comfortable. If you have never written a single line of code in your life, do not worry. This course is for you!",art:`<g class="phase"><path class="stroke trace" d="M365 245c0-35 25-61 60-61s60 26 60 61v132c0 40-26 67-60 67s-60-27-60-67z"/><path class="accent" d="M407 290c9 10 27 10 36 0M416 319h18"/><path class="stroke" d="M345 341h-64m220 0h64"/><path class="warm" d="M296 323l-15 18 15 18m235-36 15 18-15 18"/><text class="label" x="337" y="466">No experience needed</text></g><g class="phase"><path class="gold trace" d="M602 262h205v153H602z"/><path class="stroke" d="m638 338 27 27 58-66"/><text class="badge" x="639" y="397">YOU BELONG HERE</text></g>`},
{title:"You do not need to be a programmer",say:"You do not need to be a professional programmer, and you do not need to know any coding language before you begin.",art:`<g class="phase"><path class="stroke trace" d="M284 258h274v170H284z"/><path class="stroke" d="M330 303h57m-57 38h119m-119 38h76"/><path class="warm" d="m478 293 38 98m0-98-38 98"/><text class="small" x="345" y="463">No code knowledge required</text></g><g class="phase"><circle class="soft trace" cx="740" cy="341" r="82"/><path class="accent" d="M700 342h80m-40-40v80"/><text class="label" x="653" y="461">Start where you are</text></g>`},
{title:"A few essentials are enough to begin",say:"All you need are the right tools, the ability to read and write, a computer, and the willingness to learn.",art:`<g class="phase"><path class="stroke trace" d="M256 272h250v150H256zM225 442h312l-30 25H255z"/><path class="accent" d="M284 306h74m-74 25h117m-117 25h68"/><text class="label" x="310" y="510">A computer</text></g><g class="phase"><path class="warm trace" d="M642 256c-35 0-57 25-57 55 0 44 57 101 57 101s57-57 57-101c0-30-22-55-57-55z"/><path class="stroke" d="m622 311 14 14 28-31"/><text class="label" x="737" y="309">Curiosity</text><text class="small" x="737" y="335">and willingness to learn</text><path class="gold" d="M724 361h157"/><text class="label" x="737" y="403">Reading · writing · tools</text></g>`},
{title:"AI tools help you understand and create",say:"Throughout this course, we will use AI tools such as ChatGPT, Codex, and DeepSeek to help us write, understand, and manage code.",art:`<g class="phase"><path class="stroke trace" d="M248 273h260v157H248z"/><path class="accent" d="M276 309h95m-95 28h167m-167 28h112"/><text class="label" x="292" y="408">Your website project</text></g><g class="phase"><circle class="soft trace" cx="660" cy="350" r="49"/><circle class="soft" cx="809" cy="286" r="43"/><circle class="soft" cx="809" cy="414" r="43"/><path class="accent" d="m705 330 64-29m-64 68 64 28"/><text class="badge" x="617" y="356">AI</text><text class="small" x="779" y="291">ChatGPT</text><text class="small" x="785" y="419">Codex</text><text class="small" x="585" y="486">Write · understand · manage</text></g><g class="phase"><path class="warm trace" d="M570 282c-16 19-24 42-24 68s8 49 24 68"/><text class="badge" x="776" y="354">DeepSeek</text></g>`},
{title:"Your tools put instructions into action",say:"We will also use coding tools such as Visual Studio Code, PowerShell, or the Windows Command Prompt to put our instructions into action.",art:`<g class="phase"><path class="stroke trace" d="M238 267h312v177H238z"/><path class="stroke" d="M238 300h312"/><circle cx="260" cy="284" r="4" fill="#dc765f"/><circle cx="277" cy="284" r="4" fill="#d3a33d"/><circle cx="294" cy="284" r="4" fill="#648f71"/><path class="accent" d="m278 342 20 17-20 17m42 2h74"/><text class="label" x="292" y="417">Visual Studio Code</text></g><g class="phase"><path class="soft trace" d="M642 282h228v158H642z"/><path class="stroke" d="M669 315h18l-18 16 18 16m21 1h74"/><text class="label" x="756" y="380" text-anchor="middle"><tspan x="756">PowerShell /</tspan><tspan x="756" dy="24">Command Prompt</tspan></text><path class="warm" d="M555 354h69m-15-14 15 14-15 14"/></g>`},
{title:"“How can I use this if I don’t know code?”",say:"Now, you might be wondering, \"How am I going to use these tools if I don't know how to code?\"\n\nThat is exactly what we are here to learn!",art:`<g class="phase"><path class="stroke trace" d="M269 262h364v151H269z"/><path class="stroke" d="M306 304h274m-274 35h195"/><text class="label" x="319" y="390">“How do I begin?”</text><path class="accent" d="M449 426c0 40-48 49-77 49h-37l-28 26 8-39c-27-8-46-24-46-49"/></g><g class="phase"><circle class="soft trace" cx="781" cy="339" r="76"/><path class="warm" d="m745 340 24 24 48-53"/><text class="badge" x="712" y="449">That is what we learn</text></g>`},
{title:"Learn one step at a time",say:"I will guide you step by step. You do not have to understand everything on the first day.",art:`<g class="phase"><path class="stroke trace" d="M275 411c95-125 191-125 287 0"/><circle class="soft" cx="303" cy="377" r="31"/><circle class="soft" cx="418" cy="302" r="31"/><circle class="soft" cx="546" cy="376" r="31"/><text class="badge" x="296" y="383">1</text><text class="badge" x="411" y="308">2</text><text class="badge" x="539" y="382">3</text><text class="small" x="257" y="463">Watch</text><text class="small" x="391" y="360">Practise</text><text class="small" x="523" y="463">Understand</text></g><g class="phase"><path class="accent trace" d="M683 281h172v135H683z"/><path class="stroke" d="m720 334 18 18 38-43"/><text class="label" x="705" y="452">No rush to master it all</text></g>`},
{title:"Practise, follow along, ask questions",say:"Follow the lessons, practise what I demonstrate, and ask questions whenever you get stuck.",art:`<g class="phase"><path class="stroke trace" d="M250 259h226v159H250z"/><path class="accent" d="M278 300h130m-130 27h156m-156 27h106"/><text class="label" x="281" y="397">Follow the lesson</text></g><g class="phase"><path class="warm trace" d="m546 338 29 29 54-65"/><circle class="stroke" cx="575" cy="340" r="72"/><text class="small" x="575" y="441" text-anchor="middle">Try it</text></g><g class="phase"><path class="stroke trace" d="M676 276h194v113H676z"/><path class="accent" d="M721 389v34l32-34"/><text class="label" x="773" y="329" text-anchor="middle" style="font-size:17px">Ask when stuck</text><text class="small" x="773" y="359" text-anchor="middle">Questions are welcome</text></g>`},
{title:"Small steps build real coding confidence",say:"Coding is not as difficult as many people think. With the help of AI, the right tools, and a little practice, you will be surprised by how quickly you can understand the basics and start building things for yourself.",art:`<g class="phase"><path class="stroke trace" d="M254 431h570"/><path class="accent" d="m285 407 92-66 94 32 103-116 112 35"/><circle class="soft" cx="285" cy="407" r="10"/><circle class="soft" cx="377" cy="341" r="10"/><circle class="soft" cx="471" cy="373" r="10"/><circle class="soft" cx="574" cy="257" r="10"/><circle class="soft" cx="686" cy="292" r="10"/><path class="warm" d="m753 282 42 9-28 32"/><text class="small" x="280" y="469">Start</text><text class="label" x="686" y="379" text-anchor="middle">You can build</text></g><g class="phase"><path class="gold trace" d="M364 278c24-27 54-38 89-35"/><text class="badge" x="354" y="230">AI + tools + practice</text></g>`},
{title:"Why this course matters",say:"Now, let me explain the main purpose of this course.\n\nMany people own websites but depend entirely on third-party developers or companies to make even the smallest changes.",art:`<g class="phase"><path class="stroke trace" d="M264 270h256v159H264z"/><path class="accent" d="M290 302h204m-204 27h129m-129 27h181"/><text class="badge" x="312" y="407">YOUR WEBSITE</text></g><g class="phase"><circle class="soft trace" cx="709" cy="300" r="33"/><circle class="soft" cx="709" cy="404" r="33"/><path class="stroke" d="M709 333v37m-64 55c0-29 28-46 64-46s64 17 64 46"/><path class="warm" d="M557 350h71m-16-15 16 15-16 15"/><text class="label" x="796" y="307">Outside help</text><text class="small" x="796" y="333">for every small change</text></g>`},
{title:"Small updates can become costly",say:"Some people spend money every time they want to update a page, fix a problem, add a feature, or change something on their website. My goal is to help you avoid that situation.",art:`<g class="phase"><path class="stroke trace" d="M256 254h250v158H256z"/><path class="accent" d="M284 287h186m-186 25h138m-138 25h162"/><path class="gold" d="M291 370h32m-16-16v32"/><text class="small" x="395" y="375" text-anchor="middle"><tspan x="395">Update &#183; repair</tspan><tspan x="395" dy="18">improve</tspan></text></g><g class="phase"><circle class="soft trace" cx="641" cy="337" r="65"/><text class="badge" x="623" y="345">$</text><path class="warm" d="M685 337h54m-14-15 14 15-14 15"/><path class="stroke" d="M764 277h104v116H764zM778 305h75m-75 22h55"/><path class="warm" d="m785 359 58-58"/><text class="label" x="780" y="449" text-anchor="middle">Keep control of your site</text></g>`},
{title:"Take control of your own website",say:"I want you to learn how to take control of your own website, understand how it works, make changes when necessary, and use AI to help you develop and maintain it.",art:`<g class="phase"><path class="stroke trace" d="M267 264h301v178H267z"/><path class="accent" d="M267 300h301M296 330h116m-116 27h168m-168 27h95"/><path class="warm" d="m458 378 18 18 38-43"/><text class="badge" x="417" y="421" text-anchor="middle">Your website &#183; your decisions</text></g><g class="phase"><circle class="soft trace" cx="736" cy="340" r="63"/><text class="badge" x="714" y="347">YOU</text><path class="stroke" d="M736 253v-30m0 235v-30m87-88h30m-234 0h30"/><path class="accent" d="m692 272 18 22m70 92 18 22m-113 0 20-22m72-92 20-22"/><text class="small" x="736" y="455" text-anchor="middle">Understand &#183; change &#183; maintain</text></g>`},
{title:"Build websites for customers",say:"After this course, you may end up selling your websites to customers simply because they do not have the time or knowledge to manage them.",art:`<g class="phase"><path class="stroke trace" d="M256 268h264v166H256z"/><path class="accent" d="M256 302h264M286 333h154m-154 27h117"/><text class="badge" x="294" y="410">WEBSITE PROJECT</text></g><g class="phase"><circle class="soft trace" cx="691" cy="313" r="38"/><circle class="soft" cx="806" cy="313" r="38"/><path class="stroke" d="M638 412c0-42 24-66 53-66s53 24 53 66m9 0c0-42 24-66 53-66s53 24 53 66"/><path class="warm" d="M540 348h65m-16-15 16 15-16 15"/><text class="label" x="663" y="462">Create for customers</text></g>`},{title:"Guide AI and review what it creates",say:"You do not have to become a professional software engineer. You simply need enough knowledge to understand what is happening, give AI the right instructions, review what it produces, and manage your website confidently.",art:`<g class="phase"><path class="stroke trace" d="M242 271h188v133H242z"/><text class="badge" x="274" y="319">Your request</text><path class="accent" d="M272 346h122m-122 24h85"/><path class="warm" d="M440 337h78m-15-15 15 15-15 15"/><circle class="soft" cx="576" cy="337" r="52"/><text class="badge" x="552" y="343">AI</text></g><g class="phase"><path class="stroke trace" d="M664 270h185v135H664z"/><path class="accent" d="M689 307h124m-124 24h99m-99 24h112"/><path class="warm" d="m790 374 14 14 28-32"/><text class="label" x="673" y="447">Review · decide · manage</text></g>`},
{title:"Professional help can support advanced work",say:"Of course, some advanced projects may still require professional assistance, but you will no longer have to depend on someone else for every small task.",art:`<g class="phase"><path class="stroke trace" d="M264 280h244v155H264z"/><path class="accent" d="M289 315h155m-155 29h121m-121 29h92"/><text class="badge" x="297" y="415">Everyday updates</text></g><g class="phase"><circle class="soft trace" cx="701" cy="338" r="68"/><path class="stroke" d="M675 340h52m-26-26v52"/><path class="warm" d="M753 338h67m-15-15 15 15-15 15"/><text class="label" x="644" y="441">Call an expert for complex work</text></g>`},
{title:"An investment in your independence",say:"Think of this course as an investment in your independence. The knowledge you gain can save you time, reduce unnecessary expenses, and give you the confidence to build your own digital projects.",art:`<g class="phase"><path class="stroke trace" d="M291 408h494"/><path class="accent" d="m326 384 88-65 88 39 93-110 89 31"/><path class="warm" d="m653 272 31-24 9 39"/><text class="small" x="320" y="462" text-anchor="middle">Time</text><text class="small" x="455" y="462" text-anchor="middle">Savings</text><text class="small" x="590" y="462" text-anchor="middle">Confidence</text></g><g class="phase"><path class="gold trace" transform="translate(45 95) scale(.55)" d="M460 255c-24-20-58-15-72 12-18 34 6 66 72 108 66-42 90-74 72-108-14-27-48-32-72-12z"/><text class="badge" x="535" y="493" text-anchor="middle">Build projects of your own</text></g>`},
{title:"The command line will become familiar",say:"So, please do not be intimidated by technical terms, code, or the black screen of the command prompt. We will take everything one step at a time, and before long, these tools will start to feel familiar.",art:`<g class="phase"><path class="stroke trace" d="M263 265h300v177H263z"/><path class="stroke" d="m296 313 22 18-22 18m44 2h91"/><path class="accent" d="M296 377h156"/><text class="small" x="297" y="419">One instruction at a time</text></g><g class="phase"><path class="warm trace" d="M615 360c0-60 42-102 96-102s96 42 96 102"/><circle class="soft" cx="711" cy="358" r="65"/><path class="accent" d="m680 359 21 21 43-49"/><text class="label" x="641" y="452">Soon: familiar tools</text></g>`},
{title:"Are you ready? Great—let’s begin!",say:"Are you ready to take control of your website and start building with AI?\n\nGreat!\n\nLet's get started. In the next lesson, we are going to look at the tools you need, understand what each one does, and prepare your computers so that you can follow along with me.\n\nMake sure you watch the next lesson carefully, follow the instructions, and have your tools ready.\n\nThank you for joining me, and I'll see you in the next lesson!",art:`<g class="phase"><path class="stroke trace" d="M272 279h232v155H272z"/><path class="accent" d="M301 315h174m-174 28h137"/><text class="badge" x="328" y="408">TOOLS · READY</text><path class="warm" d="M545 357h89m-17-17 17 17-17 17"/></g><g class="phase"><circle class="soft trace" cx="723" cy="341" r="73"/><path class="stroke" d="m686 343 25 26 51-57"/><text class="label" x="651" y="453">See you in the next lesson!</text></g>`}
];

let delay=100;for(const phase of art.querySelectorAll('.phase')){const traces=[...phase.querySelectorAll('path')];for(const p of traces){const d=delay;setTimeout(()=>{if(id!==runId)return;board.classList.add('playing');const len=p.getTotalLength();p.style.transition=`stroke-dashoffset ${Math.max(650,Math.min(1250,len*1.4))}ms ease-in-out`;p.style.strokeDashoffset='0';follow(p,len,Math.max(650,Math.min(1250,len*1.4)),id);},d);delay+=Math.max(900,Math.min(1450,p.getTotalLength()*1.4+200));}const shapes=[...phase.querySelectorAll('.soft')],labels=[...phase.querySelectorAll('text')];const reveal=delay+180;setTimeout(()=>{if(id!==runId)return;shapes.forEach(x=>{x.style.transition='opacity .35s';x.style.opacity=1});labels.forEach(x=>{x.style.transition='opacity .3s';x.style.opacity=1})},reveal);delay=reveal+shapes.length*70+labels.length*60+250;}drawUntil=Date.now()+delay+400;}
function follow(path,len,duration,id){const start=performance.now();function step(now){if(id!==runId)return;const t=Math.min(1,(now-start)/duration);try{const pt=path.getPointAtLength(len*t),svg=art.querySelector('svg'),screen=new DOMPoint(pt.x,pt.y).matrixTransform(svg.getScreenCTM()),rect=board.getBoundingClientRect();hand.style.left=`${screen.x-rect.left-14}px`;hand.style.top=`${screen.y-rect.top-84}px`;hand.style.opacity=t>.03&&t<.98?'1':'0'}catch{}if(t<1)requestAnimationFrame(step)}requestAnimationFrame(step)}
document.querySelector('#prev').onclick=()=>setScene(current-1);document.querySelector('#next').onclick=()=>setScene(current===scenes.length-1?0:current+1);document.querySelector('#overview').onclick=()=>document.querySelector('#grid').classList.toggle('open');
const fullscreenButton=document.querySelector('#fullscreen');fullscreenButton.onclick=async()=>{try{if(document.fullscreenElement){await document.exitFullscreen()}else{await board.requestFullscreen()}}catch{fullscreenButton.textContent='Full screen unavailable'}};document.addEventListener('fullscreenchange',()=>{const active=document.fullscreenElement===board;fullscreenButton.textContent=active?'⛶ Exit full screen':'⛶ Full screen';fullscreenButton.setAttribute('aria-label',active?'Exit full screen drawing board':'Enable full screen drawing board')});const grid=document.querySelector('#grid');scenes.forEach((s,i)=>{const b=document.createElement('button');b.innerHTML=`<b>${String(i+1).padStart(2,'0')} · ${s.title}</b>${s.say.slice(0,92).replace(/\n/g,' ')}…`;b.onclick=()=>setScene(i);grid.append(b)});document.addEventListener('keydown',e=>{if(e.target.closest?.('.voice-tools, .controls button'))return;if(['ArrowRight','PageDown'].includes(e.key)){e.preventDefault();setScene(current===scenes.length-1?0:current+1)}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();setScene(current-1)}else if(e.code==='Space'){e.preventDefault();animate()}else if(e.key==='Home')setScene(0);else if(e.key==='End')setScene(scenes.length-1)});setScene(0);board.classList.add('awaiting-play');if(new URLSearchParams(location.search).get('autoplay')==='1')toggleAutoPlay();
</script></body></html>
