<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>Lesson 2 video · Osobola</title>
  <style>
    :root{color-scheme:dark;--bg:#0b1020;--ink:#f4f5f2;--muted:#a0a6b3;--line:#ffffff1a;--lime:#c2f970;--cyan:#80e2dc;--sans:'DM Sans','Segoe UI',Arial,sans-serif;--mono:'DM Mono',Consolas,monospace}
    *{box-sizing:border-box}
    html,body{min-height:100%;margin:0}
    body{min-height:100vh;background:radial-gradient(ellipse at 70% 5%,#19233b88,transparent 46%),var(--bg);color:var(--ink);font-family:var(--sans)}
    button,a{font:inherit}
    .app{min-height:100vh;display:grid;grid-template-rows:68px 1fr 54px}
    .top{display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,5vw,72px);border-bottom:1px solid var(--line);gap:16px}
    .brand{display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none;font-weight:700;letter-spacing:-.02em}
    .mark{width:31px;height:31px;border-radius:9px;background:linear-gradient(135deg,#abb8ff,#8ae4d4);color:#111726;display:grid;place-items:center;flex:none}
    .mark svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
    .top-right{display:flex;align-items:center;gap:16px}
    .lesson-tag{color:var(--lime);font:500 10px var(--mono);letter-spacing:.1em}
    .back{color:#e4e7ec;text-decoration:none;border:1px solid var(--line);border-radius:10px;padding:10px 13px;font-size:12px}
    .back:hover{border-color:#c2f9707a;color:var(--lime)}
    main{width:min(1100px,calc(100% - 40px));margin:auto;padding:38px 0 46px;align-self:center}
    .intro{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:19px}
    .eyebrow{margin:0 0 9px;color:var(--cyan);font:500 10px var(--mono);letter-spacing:.14em;text-transform:uppercase}
    h1{margin:0;font-size:clamp(25px,4vw,42px);line-height:1.08;letter-spacing:-.05em}
    .hint{margin:0;color:var(--muted);font-size:13px;line-height:1.5}
    .player{position:relative;overflow:hidden;border:1px solid #ffffff28;border-radius:18px;background:#05070c;box-shadow:0 30px 80px #0008;aspect-ratio:16/9}
    .player:fullscreen{width:100vw;height:100vh;aspect-ratio:auto;border:0;border-radius:0;display:grid;place-items:center}
    .player:fullscreen video{width:100%;height:100%;object-fit:contain}
    video{display:block;width:100%;height:100%;object-fit:contain;background:#05070c}
    .play-overlay{position:absolute;inset:0;display:grid;place-items:center;border:0;background:linear-gradient(180deg,#00000008,#00000030);cursor:pointer;transition:opacity .2s,visibility .2s}
    .play-overlay[hidden]{opacity:0;visibility:hidden;pointer-events:none}
    .play-icon{width:76px;height:76px;display:grid;place-items:center;padding-left:5px;border:1px solid #ffffff9c;border-radius:50%;background:#c2f970;color:#111726;box-shadow:0 10px 40px #0009;transition:transform .2s}
    .play-overlay:hover .play-icon{transform:scale(1.08)}
    .play-icon svg{width:25px;height:25px;fill:currentColor}
    .actions{display:flex;align-items:center;gap:14px;margin-top:17px}
    .play-button{min-height:44px;padding:0 18px;border:0;border-radius:999px;background:var(--lime);color:#111726;font-weight:750;cursor:pointer}
    .play-button:hover{filter:brightness(1.08)}
    .fullscreen-button{min-height:44px;padding:0 16px;border:1px solid var(--line);border-radius:999px;background:#ffffff08;color:var(--ink);cursor:pointer}
    .fullscreen-button:hover{border-color:#c2f9707a;color:var(--lime)}
    .status{margin:0;color:var(--muted);font-size:12px}
    .error{color:#ffaaa2}
    footer{display:flex;align-items:center;justify-content:center;border-top:1px solid var(--line);color:#747e90;font-size:11px}
    @media(max-width:600px){.app{grid-template-rows:60px 1fr 45px}.top{padding-inline:14px}.lesson-tag{display:none}.top-right{gap:8px}.back{font-size:11px;padding:9px 10px}main{width:calc(100% - 24px);padding:26px 0}.intro{display:block}.hint{margin-top:10px}.player{border-radius:12px}.play-icon{width:60px;height:60px}.actions{align-items:flex-start;flex-direction:column;gap:9px}}
  </style>
</head>
<body>
  <div class="app">
    <header class="top">
      <a class="brand" href="/" aria-label="Osobola home"><span class="mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m18 16 4-4-4-4M6 8l-4 4 4 4m8.5-12-5 16"/></svg></span><span>Osobola</span></a>
      <div class="top-right"><span class="lesson-tag">LESSON 02 · PREPARE YOUR CODING TOOLS</span><a class="back" href="index.html">← Lesson slides</a></div>
    </header>
    <main>
      <div class="intro"><div><p class="eyebrow">Lesson 2 video</p><h1>Prepare your coding tools</h1></div><p class="hint">Press play to watch the lesson video.</p></div>
      <div class="player">
        <video id="lessonVideo" playsinline preload="metadata" controls aria-label="Lesson 2 video">
          <source src="video/lesson2.mp4" type="video/mp4">
          Your browser does not support video playback.
        </video>
        <button class="play-overlay" id="playOverlay" type="button" aria-label="Play Lesson 2 video"><span class="play-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></span></button>
      </div>
      <div class="actions"><button class="play-button" id="playButton" type="button">▶ Play video</button><button class="fullscreen-button" id="fullscreenButton" type="button" aria-label="Enter full screen">⛶ Full screen</button><p class="status" id="status" role="status">The video will start when you press play.</p></div>
    </main>
    <footer>Osobola · Lesson 2</footer>
  </div>
  <script>
    const video = document.querySelector('#lessonVideo');
    const player = document.querySelector('.player');
    const playButton = document.querySelector('#playButton');
    const fullscreenButton = document.querySelector('#fullscreenButton');
    const playOverlay = document.querySelector('#playOverlay');
    const status = document.querySelector('#status');
    async function toggleVideo() {
      if (video.paused || video.ended) {
        if (video.ended) video.currentTime = 0;
        try { await video.play(); }
        catch { status.textContent = 'The video could not start. Use the video controls to try again.'; status.classList.add('error'); }
      } else video.pause();
    }
    playButton.addEventListener('click', toggleVideo);
    playOverlay.addEventListener('click', toggleVideo);
    fullscreenButton.addEventListener('click', async () => {
      try {
        if (document.fullscreenElement) await document.exitFullscreen();
        else await player.requestFullscreen();
      } catch {
        status.textContent = 'Full screen is not available in this browser.';
        status.classList.add('error');
      }
    });
    document.addEventListener('fullscreenchange', () => {
      const active = document.fullscreenElement === player;
      fullscreenButton.textContent = active ? '⛶ Exit full screen' : '⛶ Full screen';
      fullscreenButton.setAttribute('aria-label', active ? 'Exit full screen' : 'Enter full screen');
    });
    video.addEventListener('play', () => { playButton.textContent = '❚❚ Pause video'; playOverlay.hidden = true; status.textContent = 'Video playing.'; status.classList.remove('error'); });
    video.addEventListener('pause', () => { playButton.textContent = '▶ Play video'; playOverlay.hidden = false; status.textContent = 'Video paused.'; });
    video.addEventListener('ended', () => { playButton.textContent = '↻ Replay video'; playOverlay.hidden = false; status.textContent = 'Lesson video finished.'; });
    video.addEventListener('error', () => { status.textContent = 'The lesson video could not be loaded.'; status.classList.add('error'); });
  </script>
</body>
</html>
